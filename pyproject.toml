[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reeltime"
version = "0.1.0"
description = "Deterministic record/replay debugger for LLM agents: replay a failed run offline, instantly, for free"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vedanth Dharnish" }]
keywords = [
  "llm", "agents", "debugging", "debugger", "record", "replay",
  "determinism", "openai", "anthropic", "observability", "testing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# httpx/requests are optional at runtime -- the shim installs only if the
# module is already importable. They are required to *test* the shim, and the
# provider SDKs are required to prove the transport is genuinely
# provider-agnostic rather than tuned to one client's request shape.
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "httpx>=0.27",
  "requests>=2.32",
  "openai>=1.66",
  "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/vedanth2406/reeltime"
Repository = "https://github.com/vedanth2406/reeltime"
Issues = "https://github.com/vedanth2406/reeltime/issues"
Changelog = "https://github.com/vedanth2406/reeltime/blob/main/CHANGELOG.md"

[project.scripts]
tape = "reeltime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reeltime"]
# The sitecustomize shim is data, not an importable submodule: `tape run` puts
# its directory on PYTHONPATH so the interpreter picks it up at startup.
artifacts = ["src/reeltime/_bootstrap/sitecustomize.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/reeltime/core"]
