[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reeltime"
version = "1.0.0"
description = "Deterministic record/replay debugger for LLM agents: replay a failed run offline, instantly, for free"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vedanth Dharnish" }]
keywords = [
  "llm", "agents", "debugging", "debugger", "record", "replay",
  "determinism", "openai", "anthropic", "observability", "testing",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# httpx/requests are optional at runtime -- the shim installs only if the
# module is already importable. They are required to *test* the shim, and the
# provider SDKs are required to prove the transport is genuinely
# provider-agnostic rather than tuned to one client's request shape.
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "httpx>=0.27",
  "requests>=2.32",
  "openai>=1.66",
  "anthropic>=0.40",
  # The ambient patcher supports numpy.random; without it here, its tests are
  # skipped and the support rots unnoticed.
  "numpy>=1.26",
  # The wheel gate builds a distribution as part of the test run.
  "build>=1.0",
  # aiohttp is deliberately *not* intercepted (see core/http/aiohttp_guard.py).
  # It is a dev dependency anyway, because the guard that keeps that decision
  # from being silent is only tested if aiohttp is importable.
  "aiohttp>=3.9",
  # The MCP adapter and its two transport tests. Marked rather than optional:
  # a module-level importorskip is how `numpy` silently skipped 25 tests once,
  # so `tests/test_mcp.py` asserts the SDK is present wherever it can install.
  # The SDK itself requires 3.10; reeltime supports 3.9.
  "mcp>=1.9; python_version>='3.10'",
  # Serves the HTTP and SSE MCP fixtures on a real socket.
  "uvicorn>=0.30; python_version>='3.10'",
  # The LangChain adapter. Pinned to the range `core/langchain.py` declares and
  # the README states: the callback contract is not promised across a major
  # version, so the tests have to run against something the adapter admits to
  # supporting. `langchain` and `langchain-openai` are here because the claim
  # worth testing is a real agent with real tools making real HTTP calls --
  # that a model node produces one event and not two cannot be shown with a
  # fake chat model. Like `mcp`, these need 3.10; reeltime supports 3.9.
  "langchain-core>=1.5,<2; python_version>='3.10'",
  "langchain>=1.3,<2; python_version>='3.10'",
  "langchain-openai>=1.5,<2; python_version>='3.10'",
  # boto3 for the urllib3 shim's reason to exist. The shim itself is tested
  # against a plain urllib3 pool, but the claim worth testing is that a real
  # botocore call records and replays -- botocore signs before it sends, and
  # that is the whole reason `core/aws.py` exists, so a fake client would skip
  # exactly the layer that made this milestone hard.
  "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/vedanth2406/reeltime"
Repository = "https://github.com/vedanth2406/reeltime"
Issues = "https://github.com/vedanth2406/reeltime/issues"
Changelog = "https://github.com/vedanth2406/reeltime/blob/main/CHANGELOG.md"
Contributing = "https://github.com/vedanth2406/reeltime/blob/main/CONTRIBUTING.md"

[project.scripts]
tape = "reeltime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reeltime"]
# The sitecustomize shim is data, not an importable submodule: `tape run` puts
# its directory on PYTHONPATH so the interpreter picks it up at startup.
artifacts = ["src/reeltime/_bootstrap/sitecustomize.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The wheel gate builds a distribution and a virtualenv, so it is deselected
# from the inner loop and run explicitly in CI with `pytest -m wheel`.
addopts = "-q -m 'not wheel'"
markers = [
  "wheel: installs the built wheel into a symlinked virtualenv (slow; CI gate)",
]

[tool.coverage.run]
source = ["src/reeltime/core"]
