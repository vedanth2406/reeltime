[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reeltime"
version = "0.1.0.dev0"
description = "Deterministic record/replay debugger for LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vedanth" }]
keywords = ["llm", "agents", "debugging", "record", "replay", "determinism"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
# httpx/requests are optional at runtime -- the shim installs only if the
# module is already importable. They are required to *test* the shim, and the
# provider SDKs are required to prove the transport is genuinely
# provider-agnostic rather than tuned to one client's request shape.
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "httpx>=0.27",
  "requests>=2.32",
  "openai>=1.66",
  "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/vedanth/reeltime"
Issues = "https://github.com/vedanth/reeltime/issues"

[project.scripts]
tape = "reeltime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reeltime"]
# The sitecustomize shim is data, not an importable submodule: `tape run` puts
# its directory on PYTHONPATH so the interpreter picks it up at startup.
artifacts = ["src/reeltime/_bootstrap/sitecustomize.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/reeltime/core"]
